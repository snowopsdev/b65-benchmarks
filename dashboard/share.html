<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B65 Bench · share cards</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04); --accent: #2a78d6;
  --good-text: #006300; --good: #0ca30c; --serious: #ec835a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05); --accent: #3987e5;
    --good-text: #0ca30c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { min-height: 100vh; background: var(--page); color: var(--text-primary);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 8px 0 0; text-transform: uppercase; letter-spacing: .04em; }
a { color: var(--accent); }
.sub { color: var(--text-secondary); }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; color: var(--text-secondary); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--text-primary); font-weight: 600; }
input[type=text] { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--page); color: var(--text-primary); width: 160px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; }
.card canvas { width: 100%; height: auto; border-radius: 8px; display: block; background: #0d0d0d; }
.prev { position: relative; }
.lock { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; border-radius: 8px;
  background: rgba(13,13,13,.72); color: #f0efec; font-weight: 600; padding: 16px; backdrop-filter: blur(6px); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.name { font-weight: 650; }
.tag { font-size: 12px; font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
.tag.safe { color: var(--good-text); } .tag.locked { color: var(--text-secondary); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btns button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--page); color: var(--text-primary); cursor: pointer; }
.btns button:disabled { opacity: .4; cursor: not-allowed; }
.opts select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--page); color: var(--text-primary); }
.cc { text-align: right; margin-top: -6px; } .cc.over { color: #d03b3b; font-weight: 600; }
textarea { width: 100%; font: 13px/1.4 inherit; font-family: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--page); color: var(--text-primary); resize: vertical; min-height: 64px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a19; color: #f0efec;
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.note { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.tabs button { font: inherit; text-align: left; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-primary); cursor: pointer; display: grid; gap: 2px; min-width: 150px; }
.tabs button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tabs .tn { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.tabs .tc { font-size: 12px; color: var(--text-secondary); }
.tabs .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good-text); display: none; }
.tabs .dot.on { display: inline-block; animation: tpulse 1.6s infinite; }
@keyframes tpulse { 50% { opacity: .3; } }
.phead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.phead h2 { margin: 0; font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--text-primary); }
.phase { display: grid; gap: 14px; }
.phase[hidden] { display: none; }
.phase h3 { font-size: 12px; font-weight: 650; color: var(--text-secondary); margin: 6px 0 0; text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 640px) { .viz-root { padding: 12px; } .grid { grid-template-columns: 1fr; } }
</style>
<script src="nav.js"></script>
</head>
<body>
<div class="viz-root"><div class="wrap">
  <header>
    <h1>Share cards</h1>
    <span class="sub" id="runinfo">loading…</span>
  </header>
  <div class="controls">
    <span>Format</span>
    <div class="seg" id="fmt">
      <button data-f="wide" aria-pressed="true">16:9 · X / LinkedIn</button>
      <button data-f="tall" aria-pressed="false">4:5 · Instagram / Threads</button>
    </div>
    <label>Handle <input type="text" id="handle" placeholder="@yourhandle"></label>
    <label>Card price <input type="text" id="price" placeholder="what you paid"></label>
    <span class="note">Teasers refresh every 10 s as tests finish.</span>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Phase"></div>
  <div id="panels"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- tokens (dark card palette; series slots 1-3 validated all-pairs for dark) ----------
const C = { page: "#0d0d0d", surf: "#1a1a19", ink: "#f0efec", ink2: "#c3c2b7", muted: "#898781",
  grid: "#2c2c2a", axis: "#383835", good: "#0ca30c", critical: "#d03b3b",
  series: ["#3987e5", "#d95926", "#199e70"] };
const FONT = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const TESTS = ["pp512", "pp4096", "pp16384", "tg128", "tg128@d4096", "tg128@d16384"];
const TLAB = { pp512: ["Prefill", "512"], pp4096: ["Prefill", "4K"], pp16384: ["Prefill", "16K"],
  tg128: ["Decode", "@ 0 ctx"], "tg128@d4096": ["Decode", "@ 4K ctx"], "tg128@d16384": ["Decode", "@ 16K ctx"] };
const SIZES = { wide: [1200, 675], tall: [1080, 1350] }, SCALE = 2;
const $ = id => document.getElementById(id);
let D = null, fmt = localStorage.getItem("b65fmt") || "wide";
$("handle").value = localStorage.getItem("b65handle") || "";
$("price").value = localStorage.getItem("b65price") || "";
// card price is typed in by the user (never guessed); bare numbers get a $ prefix
const price = () => { const p = $("price").value.trim(); return /^\d[\d,.]*$/.test(p) ? "$" + p : p; };

// ---------- canvas helpers ----------
const font = (ctx, px, w = 400) => ctx.font = `${w} ${px}px ${FONT}`;
function text(ctx, s, x, y, px, { w = 400, color = C.ink, align = "left", base = "alphabetic", max } = {}) {
  font(ctx, px, w);
  if (max) while (px > 8 && ctx.measureText(s).width > max) font(ctx, --px, w);
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function wrap(ctx, s, maxW) {
  const lines = []; let line = "";
  for (const word of s.split(" ")) {
    const t = line ? line + " " + word : word;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = word; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
function rr(ctx, x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
const mcolor = i => C.series[i % C.series.length];

// header + footer shared by every card; returns the body rect
function frame(ctx, W, H, u, { kicker, title, sub, live, results, foot: footOverride }) {
  ctx.fillStyle = C.page; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.85, -H * 0.1, 0, W * 0.85, -H * 0.1, W * 0.9);
  g.addColorStop(0, "rgba(57,135,229,0.20)"); g.addColorStop(1, "rgba(57,135,229,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const P = 56 * u; let y = P + 14 * u;
  text(ctx, kicker || "INTEL ARC PRO B65 · 32 GB · LLAMA.CPP VULKAN", P, y, 16 * u, { w: 700, color: C.series[0] });
  if (live || results) {   // status pill, icon + label (never color alone)
    const lbl = live ? "BENCHMARK RUNNING" : "FULL RUN COMPLETE";
    font(ctx, 15 * u, 700); const tw = ctx.measureText(lbl).width, pw = tw + 52 * u, ph = 32 * u;
    rr(ctx, W - P - pw, y - 22 * u, pw, ph, ph / 2, C.surf, "rgba(255,255,255,0.12)", 1.5 * u);
    const dx = W - P - 14 * u - tw - 18 * u;
    ctx.beginPath(); ctx.arc(dx, y - 6 * u, 5 * u, 0, 7);
    ctx.fillStyle = C.good; ctx.fill();
    if (live) { ctx.beginPath(); ctx.arc(dx, y - 6 * u, 9 * u, 0, 7); ctx.strokeStyle = "rgba(12,163,12,.35)"; ctx.lineWidth = 3 * u; ctx.stroke(); }
    text(ctx, lbl, W - P - 14 * u, y, 15 * u, { w: 700, color: C.ink, align: "right" });
  }
  y += 52 * u; text(ctx, title, P, y, 46 * u, { w: 750, max: W - 2 * P });
  if (sub) { y += 38 * u; text(ctx, sub, P, y, 22 * u, { color: C.ink2, max: W - 2 * P }); }
  const st = D.stack, fy = H - P + 8 * u;
  ctx.fillStyle = C.grid; ctx.fillRect(P, fy - 34 * u, W - 2 * P, 1.5 * u);
  const foot = footOverride || `Arc Pro B65 32 GB · llama.cpp b${st.llama_build} Vulkan · Mesa ${st.mesa} · Linux ${st.kernel.split("-")[0]}`;
  const handle = $("handle").value.trim();
  const hw = handle ? text(ctx, handle, W - P, fy, 17 * u, { w: 700, color: C.ink2, align: "right" }) + 24 * u : 0;
  text(ctx, foot, P, fy, 15 * u, { color: C.muted, max: W - 2 * P - hw });
  return { x: P, y: y + 40 * u, w: W - 2 * P, h: fy - 34 * u - 28 * u - (y + 40 * u) };
}

function legend(ctx, x, y, u, models, maxW) {
  let cx = x;
  models.forEach((m, i) => {
    rr(ctx, cx, y - 12 * u, 14 * u, 14 * u, 4 * u, mcolor(i));
    cx += 22 * u + text(ctx, `${m.display} ${m.quant}`, cx + 22 * u, y, 17 * u, { color: C.ink2 }) + 24 * u;
  });
}

// ---------- teaser components (inputs: statuses only) ----------
function drawMatrix(ctx, b, u, d) {
  const labW = Math.min(250 * u, b.w * 0.34), headH = 54 * u;
  const cw = (b.w - labW) / TESTS.length, rh = Math.min(76 * u, (b.h - headH) / d.models.length);
  const cell = Math.min(cw, rh) - 14 * u;
  TESTS.forEach((t, j) => {
    const cx = b.x + labW + cw * j + cw / 2;
    text(ctx, TLAB[t][0], cx, b.y + 18 * u, 15 * u, { w: 600, color: C.ink2, align: "center" });
    text(ctx, TLAB[t][1], cx, b.y + 38 * u, 14 * u, { color: C.muted, align: "center" });
  });
  d.models.forEach((m, i) => {
    const cy = b.y + headH + rh * i + rh / 2;
    text(ctx, m.display, b.x, cy - 2 * u, 20 * u, { w: 650, max: labW - 12 * u });
    text(ctx, m.quant + (m.size_gb ? ` · ${m.size_gb} GB` : ""), b.x, cy + 20 * u, 14 * u, { color: C.muted });
    TESTS.forEach((t, j) => {
      const c = d.cells.find(c => c.model === m.name && c.test === t), st = c ? c.status : "pending";
      const x = b.x + labW + cw * j + (cw - cell) / 2, y = cy - cell / 2;
      if (st === "running") {
        rr(ctx, x, y, cell, cell, 8 * u, "rgba(12,163,12,0.12)", C.good, 2.5 * u);
        ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, 6 * u, 0, 7); ctx.fillStyle = C.good; ctx.fill();
      } else if (st === "pending") {
        rr(ctx, x, y, cell, cell, 8 * u, null, C.axis, 2 * u);
      } else {
        rr(ctx, x, y, cell, cell, 8 * u, mcolor(i));
        ctx.strokeStyle = C.page; ctx.lineWidth = 3.5 * u; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath();
        ctx.moveTo(x + cell * .3, y + cell * .52); ctx.lineTo(x + cell * .44, y + cell * .66); ctx.lineTo(x + cell * .72, y + cell * .36); ctx.stroke();
      }
    });
  });
}

function drawWave(ctx, b, u, shape, label) {
  text(ctx, label, b.x, b.y + 16 * u, 15 * u, { w: 600, color: C.ink2 });
  const y0 = b.y + 28 * u, h = b.h - 28 * u;
  ctx.fillStyle = C.grid; ctx.fillRect(b.x, y0 + h, b.w, 1.5 * u);
  if (shape.length < 2) { text(ctx, "collecting…", b.x, y0 + h / 2, 14 * u, { color: C.muted }); return; }
  const X = i => b.x + i / (shape.length - 1) * b.w, Y = v => y0 + h - (0.08 + v * 0.84) * h;
  ctx.beginPath(); shape.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  const line = new Path2D(); shape.forEach((v, i) => i ? line.lineTo(X(i), Y(v)) : line.moveTo(X(i), Y(v)));
  ctx.lineTo(X(shape.length - 1), y0 + h); ctx.lineTo(b.x, y0 + h); ctx.closePath();
  const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, "rgba(57,135,229,0.35)"); g.addColorStop(1, "rgba(57,135,229,0)");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = C.series[0]; ctx.lineWidth = 2.5 * u; ctx.lineJoin = "round"; ctx.stroke(line);
  ctx.beginPath(); ctx.arc(X(shape.length - 1), Y(shape[shape.length - 1]), 6 * u, 0, 7); ctx.fillStyle = C.series[0]; ctx.fill();
}

function drawProgress(ctx, b, u, d) {
  font(ctx, 96 * u, 800); ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const big = `${d.done}`, bw = ctx.measureText(big).width;
  ctx.fillText(big, b.x, b.y + 84 * u);
  text(ctx, `/ ${d.total}`, b.x + bw + 12 * u, b.y + 84 * u, 40 * u, { w: 700, color: C.muted });
  text(ctx, d.unit || "tests complete", b.x, b.y + 118 * u, 20 * u, { color: C.ink2 });
  const by = b.y + 140 * u;
  rr(ctx, b.x, by, b.w, 12 * u, 6 * u, C.surf);
  if (d.done) rr(ctx, b.x, by, Math.max(12 * u, b.w * d.done / d.total), 12 * u, 6 * u, C.series[0]);
  return by + 12 * u;
}

function drawP05Grid(ctx, b, u, d, ms) {
  const labW = Math.min(230 * u, b.w * 0.3), headH = 66 * u, gw = (b.w - labW) / P05_TESTS.length;
  const rh = Math.min(84 * u, (b.h - headH) / ms.length), cell = Math.min(gw / 2 - 10 * u, rh - 22 * u);
  P05_TESTS.forEach((t, j) => {
    const cx = b.x + labW + gw * j + gw / 2;
    text(ctx, TLAB[t][0], cx, b.y + 16 * u, 15 * u, { w: 600, color: C.ink2, align: "center" });
    text(ctx, TLAB[t][1], cx, b.y + 34 * u, 13 * u, { color: C.muted, align: "center" });
    text(ctx, "off", cx - gw / 4, b.y + 56 * u, 12 * u, { color: C.muted, align: "center" });
    text(ctx, "on", cx + gw / 4, b.y + 56 * u, 12 * u, { color: C.muted, align: "center" });
  });
  ms.forEach((m, i) => {
    const cy = b.y + headH + rh * i + rh / 2, mi = d.models.indexOf(m);
    text(ctx, m.display, b.x, cy - 2 * u, 19 * u, { w: 650, max: labW - 12 * u });
    text(ctx, m.quant, b.x, cy + 18 * u, 13 * u, { color: C.muted });
    P05_TESTS.forEach((t, j) => ["0", "1"].forEach((fa, k) => {
      const c = p5(d, m, t, fa), st = c ? c.status : "pending";
      const x = b.x + labW + gw * j + gw / 4 + k * gw / 2 - cell / 2, y = cy - cell / 2;
      if (st === "running") {
        rr(ctx, x, y, cell, cell, 7 * u, "rgba(12,163,12,0.12)", C.good, 2.5 * u);
        ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, 5 * u, 0, 7); ctx.fillStyle = C.good; ctx.fill();
      } else if (st === "pending") rr(ctx, x, y, cell, cell, 7 * u, null, C.axis, 2 * u);
      else if (st === "skipped") {
        ctx.setLineDash([4 * u, 4 * u]); rr(ctx, x, y, cell, cell, 7 * u, null, C.muted, 1.5 * u); ctx.setLineDash([]);
        text(ctx, "P0", x + cell / 2, y + cell / 2 + 5 * u, 12 * u, { w: 700, color: C.muted, align: "center" });
      } else {
        rr(ctx, x, y, cell, cell, 7 * u, mcolor(mi));
        ctx.strokeStyle = C.page; ctx.lineWidth = 3 * u; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath();
        ctx.moveTo(x + cell * .3, y + cell * .52); ctx.lineTo(x + cell * .44, y + cell * .66); ctx.lineTo(x + cell * .72, y + cell * .36); ctx.stroke();
      }
    }));
  });
  text(ctx, "P0 = reused from Phase 0 (same build and settings)", b.x + labW, b.y + headH + rh * ms.length + 22 * u, 13 * u, { color: C.muted });
}

// ---------- Phase 1 helpers ----------
const DEPTH = { tg128: "0", "tg128@d4096": "4K", "tg128@d8192": "8K", "tg128@d16384": "16K", "tg128@d32768": "32K" };
const sizeLab = n => n >= 1024 ? `${n / 1024}K` : `${n}`;
const p1b = (d, m, t) => (d.p1.bench || []).find(c => c.model === m.name && c.test === t);
const p1s = (d, m, n) => (d.p1.serve || []).find(c => c.model === m.name && c.size === n);
const p1i = (d, m) => (d.p1.idle || []).find(c => c.model === m.name);
const p1ms = d => d.models.filter(m => (d.p1.models || []).includes(m.name));
const p1ready = d => !!(d.p1 && d.p1.complete);
const p1lock = d => `Unlocks when Phase 1${d.p1 && d.p1.sycl ? "S" : ""} finishes (${d.p1 ? d.p1.done : 0} of ${d.p1 ? d.p1.total : 45} steps so far)`;
const p1kick = d => d.p1 && d.p1.sycl ? "INTEL ARC PRO B65 · 32 GB · PHASE 1 ON SYCL" : "INTEL ARC PRO B65 · 32 GB · PHASE 1";
const p1eng = d => d.p1 && d.p1.sycl ? "SYCL, flash attention on" : "Vulkan, flash attention off";
function p1foot(d) {   // undefined = the default (Vulkan) footer
  if (!d.p1 || !d.p1.sycl) return undefined;
  const st = d.stack, e = d.p1.env || {}, v = (x, re) => ((x || "").match(re) || [])[1];
  const cr = v(e.compute_runtime, /compute-runtime (\d+\.\d+)/), oa = v(e.oneapi, /dpcpp-cpp (\d{4}\.\d+)/);
  return `Arc Pro B65 32 GB · llama.cpp b${st.llama_build} SYCL (oneAPI${oa ? " " + oa : ""}${cr ? ", compute-runtime " + cr : ""}) · Linux ${st.kernel.split("-")[0]}`;
}
const viewP1S = d => ({ ...d, p1: d.p1s || {} });
// Gemma llama-server rerun (p1-swa-*): one config per variant
const p1gv = (d, name) => ((d.p1 && d.p1.rerun && d.p1.rerun.variants) || []).find(v => v.name === name);
const p1gReady = d => p1ready(d) && !!(d.p1.rerun && d.p1.rerun.complete) && (p1gv(d, "ckpt-off") || {}).status === "ok";
const p1gs = (d, name, n) => ((p1gv(d, name) || {}).serve || []).find(x => x.size === n) || {};
const secs = v => v == null ? "–" : v < 10 ? `${v.toFixed(1)} s` : v < 90 ? `${v.toFixed(0)} s` : fmtT(v);
const secRange = (a, b) => { const x = secs(a), y = secs(b); if (x === y) return x;
  return x.includes("min") || y.includes("min") ? `${x} – ${y}` : x.endsWith(" s") && y.endsWith(" s") ? `${x.slice(0, -2)}–${y}` : `${x}–${y}`; };
const wRange = (a, b) => Math.round(a) === Math.round(b) ? `${Math.round(a)} W` : `${Math.round(a)}–${Math.round(b)} W`;
function p1answer(d) {   // poll: Qwen's TTFT on a 16K-token prompt

  const P = { l: 8 * u, r: 150 * u, t: 30 * u, b: 34 * u }, x0 = b.x + P.l, x1 = b.x + b.w - P.r;
  const ser = ms.map(m => ({ m, i: d.models.indexOf(m), off: decodeVals(d, m, "0"), on: decodeVals(d, m, "1") }));
  const all = ser.flatMap(s => [...s.off, ...s.on]).filter(v => v != null);
  const lo = Math.floor(Math.min(...all) * 0.85), hi = Math.ceil(Math.max(...all) * 1.05);
  const X = k => x0 + (x1 - x0) * k / 2, Y = v => b.y + P.t + (b.h - P.t - P.b) * (1 - (v - lo) / (hi - lo));
  ["0 ctx", "4K", "16K"].forEach((l, k) => {
    ctx.fillStyle = C.grid; ctx.fillRect(X(k) - 0.75 * u, b.y + P.t - 6 * u, 1.5 * u, b.h - P.t - P.b + 6 * u);
    text(ctx, l, X(k), b.y + b.h - 8 * u, 15 * u, { color: C.muted, align: k === 0 ? "left" : k === 2 ? "right" : "center" });
  });
  if (lo < 15 && hi > 15) {   // the registry's 15 tok/s line
    ctx.setLineDash([6 * u, 6 * u]); ctx.strokeStyle = C.muted; ctx.lineWidth = 1.2 * u; ctx.beginPath(); ctx.moveTo(x0, Y(15)); ctx.lineTo(x1, Y(15)); ctx.stroke(); ctx.setLineDash([]);
    text(ctx, "15 tok/s", x0 + 6 * u, Y(15) - 6 * u, 12 * u, { color: C.muted });
  }
  const line = (vals, col, w, dash, alpha) => {
    ctx.save(); ctx.globalAlpha = alpha; ctx.setLineDash(dash); ctx.beginPath();
    let started = false; vals.forEach((v, k) => { if (v == null) return; started ? ctx.lineTo(X(k), Y(v)) : ctx.moveTo(X(k), Y(v)); started = true; });
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.stroke(); ctx.restore();
  };
  ser.forEach(s => line(s.on, mcolor(s.i), 2 * u, [5 * u, 5 * u], 0.5));
  ser.forEach(s => { line(s.off, mcolor(s.i), 3 * u, [], 1);
    s.off.forEach((v, k) => { if (v == null) return; ctx.beginPath(); ctx.arc(X(k), Y(v), 5.5 * u, 0, 7); ctx.fillStyle = mcolor(s.i); ctx.fill(); ctx.strokeStyle = C.page; ctx.lineWidth = 2 * u; ctx.stroke(); }); });
  const ends = ser.filter(s => s.off[2] != null).map(s => ({ s, y: Y(s.off[2]) })).sort((a, c) => a.y - c.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 40 * u);
  ends.forEach(({ s, y }) => { text(ctx, s.off[2].toFixed(1), x1 + 14 * u, y + 2 * u, 19 * u, { w: 750 }); text(ctx, short(s.m), x1 + 14 * u, y + 20 * u, 14 * u, { color: C.ink2 }); });

}
function facts(d) {
  const ok = d.cells.filter(c => c.status === "ok"), tg0 = d.models.map(m => cell(d, m, "tg128")).filter(c => c && c.status === "ok");
  const bw = +((d.rig.gpu_spec.match(/(\d+) GB\/s/) || [])[1] || 0);
  const bwp = d.models.map(m => { const c = cell(d, m, "tg128"); return c && c.status === "ok" && m.size_gb && bw ? 100 * c.tok_s / (bw / m.size_gb) : null; }).filter(x => x != null);
  const watts = ok.map(c => c.watts).filter(Boolean);
  return {
    tests: d.cells.length, failed: d.cells.filter(c => c.status === "failed" || c.status === "no_output").length,
    dmin: Math.min(...tg0.map(c => c.tok_s)).toFixed(1), dmax: Math.max(...tg0.map(c => c.tok_s)).toFixed(1),
    drops: d.models.map(m => { const a = cell(d, m, "tg128"), z = cell(d, m, "tg128@d16384");
      return a && z && a.status === "ok" && z.status === "ok" ? [short(m), Math.round(100 * (1 - z.tok_s / a.tok_s))] : null; }).filter(Boolean),
    bw, bwlo: Math.round(Math.min(...bwp)), bwhi: Math.round(Math.max(...bwp)),
    pmin: Math.round(Math.min(...watts)), pmax: Math.round(Math.max(...watts)), idle: d.idle_w ? Math.round(d.idle_w) : "–",
    cap: d.rig.power_cap_w || "200", held: [...new Set(d.cells.filter(c => c.status === "held").map(c => short(d.models.find(m => m.name === c.model))))],
  };
}
// slope chart: one line per model across the given tests; end labels spread so they never collide
function drawSlope(ctx, b, u, d, tests, xlabels, title) {
  text(ctx, title, b.x, b.y + 16 * u, 16 * u, { w: 650, color: C.ink2 });
  const P = { l: 8 * u, r: 150 * u, t: 44 * u, b: 34 * u }, x0 = b.x + P.l, x1 = b.x + b.w - P.r;
  const series = d.models.map((m, i) => ({ m, i, v: tests.map(t => { const c = cell(d, m, t); return c && c.status === "ok" ? c.tok_s : null; }) }));
  const all = series.flatMap(s => s.v).filter(v => v != null);
  const lo = Math.floor(Math.min(...all) * 0.85), hi = Math.ceil(Math.max(...all) * 1.05);
  const X = k => x0 + (x1 - x0) * k / (tests.length - 1), Y = v => b.y + P.t + (b.h - P.t - P.b) * (1 - (v - lo) / (hi - lo));
  xlabels.forEach((l, k) => {
    ctx.fillStyle = C.grid; ctx.fillRect(X(k) - 0.75 * u, b.y + P.t - 6 * u, 1.5 * u, b.h - P.t - P.b + 6 * u);
    text(ctx, l + (k === 0 ? " ctx" : ""), X(k), b.y + b.h - 8 * u, 15 * u, { color: C.muted, align: k === 0 ? "left" : k === tests.length - 1 ? "right" : "center" });
  });
  series.forEach(s => {
    ctx.beginPath(); s.v.forEach((v, k) => v != null && (k ? ctx.lineTo(X(k), Y(v)) : ctx.moveTo(X(k), Y(v))));
    ctx.strokeStyle = mcolor(s.i); ctx.lineWidth = 3 * u; ctx.lineJoin = "round"; ctx.stroke();
    s.v.forEach((v, k) => { if (v == null) return; ctx.beginPath(); ctx.arc(X(k), Y(v), 5.5 * u, 0, 7); ctx.fillStyle = mcolor(s.i); ctx.fill();
      ctx.strokeStyle = C.page; ctx.lineWidth = 2 * u; ctx.stroke(); });
  });
  const ends = series.filter(s => s.v[s.v.length - 1] != null).map(s => ({ s, y: Y(s.v[s.v.length - 1]) })).sort((a, c) => a.y - c.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 40 * u);
  ends.forEach(({ s, y }) => {
    text(ctx, s.v[s.v.length - 1].toFixed(1), x1 + 14 * u, y + 2 * u, 19 * u, { w: 750 });
    text(ctx, short(s.m), x1 + 14 * u, y + 20 * u, 14 * u, { color: C.ink2 });
  });
}
function num(d, m, t, key, digits, unit = "") {
  const c = cell(d, m, t);
  if (c && c.status === "held") return "held";
  if (!c || c.status !== "ok") return "failed";
  return c[key] != null ? Number(c[key]).toFixed(digits) + (unit ? " " + unit : "") : "n/a";
}

// ---------- page ----------
// phases on the share page: card.group (none = Phase 0) -> tab + panel; st(D) gives that phase's run status
const SHARE_PHASES = [
  { key: "p0", label: "Phase 0", name: "Baseline", href: "./", st: d => d },
  { key: "p05", label: "Phase 0.5", name: "Flash attention", href: "p05", st: d => d.p05 || {} },
  { key: "p1", label: "Phase 1", name: "Context & serving", href: "p1", st: d => d.p1 || {} },
  { key: "p2", label: "Phase 2", name: "Vulkan vs SYCL", href: "p2", st: d => d.p2 || {} },
  { key: "p1s", label: "Phase 1S", name: "Phase 1 on SYCL", href: "p1s", st: d => d.p1s || {} },
  { key: "gd", label: "Gemma diag", name: "SYCL prefill fix", href: "gd", st: d => d.gd || {} },
  { key: "p3", label: "Phase 3", name: "Quality checks", href: "p3", st: d => d.p3 || {} },
  { key: "p4", label: "Phase 4", name: "Canary", href: "p4", st: d => d.p4 || {} },
  { key: "us", label: "Phase 4+", name: "Server at ub 2048", href: "us", st: d => d.us || {} },
  { key: "p5", label: "Phase 5", name: "Open questions", href: "p5", st: d => d.p5 || {} },
  { key: "p6", label: "Phase 6", name: "Confirming the recipes", href: "p6", st: d => d.p6 || {} },
  { key: "sum", label: "Conclusion", name: "Best settings", href: "files/findings/recommended-settings.md", st: d => ({ run_id: "Phases 0–6", state: "finished", complete: sumReady(d) }) },
];
const groupOf = card => card.group || "p0";
let tab = null;
const pick = {}, variantPick = {};
function gate(card) { return card.ready ? card.ready(D) : (card.safe || D.complete); }
function lockText(card) { return card.lockMsg ? card.lockMsg(D) : `Unlocks when all ${D.total} tests are done (${D.done} so far)`; }
function eligible(card) { return card.models ? card.models(D) : null; }
function chosen(card) { const ms = eligible(card); return ms ? (ms.find(m => m.name === pick[card.id]) || ms[0]) : null; }
function render(card, canvas, m) {
  const [W, H] = card.size || SIZES[fmt], u = Math.min(W / 1200, H / 675) * (fmt === "tall" && !card.size ? 1.15 : 1);
  canvas.width = W * SCALE; canvas.height = H * SCALE;
  const ctx = canvas.getContext("2d"); ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  card.draw(ctx, W, H, u, D, m);
}
const toast = m => { const t = $("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 1800); };
const blob = c => new Promise(r => c.toBlob(r, "image/png"));
const fname = (card, m) => `b65-${card.id}${m ? "-" + m.name : ""}-${card.size ? card.sizeName || "banner" : fmt}-${D.run_id}${card.safe && !D.complete ? `-${D.done}of${D.total}` : ""}.png`;
function counter(el) {
  const ta = el.querySelector("textarea"), cc = el.querySelector(".cc"), n = [...ta.value].length;
  cc.textContent = ta.value ? `${n} / 280` : ""; cc.className = "note cc" + (n > 280 ? " over" : "");
}

function build() {
  $("tabs").innerHTML = SHARE_PHASES.map(p => `<button role="tab" data-k="${p.key}" aria-selected="false">
    <span class="tn"><span class="dot" id="tdot-${p.key}"></span>${p.label} · ${p.name}</span><span class="tc" id="tc-${p.key}"></span></button>`).join("");
  $("panels").innerHTML = SHARE_PHASES.map(p => `<section class="phase" id="panel-${p.key}" role="tabpanel" hidden>
    <div class="phead"><h2>${p.label} · ${p.name}</h2><span class="sub" id="pst-${p.key}"></span><a href="${p.href}">dashboard →</a></div>
    <p class="note" id="ppol-${p.key}" style="margin:0"></p>
    <h3>Post now · no measured numbers</h3><div class="grid" id="${p.key}-teasers"></div>
    <h3>Results · unlock when the run finishes</h3><div class="grid" id="${p.key}-results"></div></section>`).join("");
  $("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) selectTab(b.dataset.k); });
  for (const card of CARDS) {
    const box = $(`${groupOf(card)}-${card.safe ? "teasers" : "results"}`);
    const el = document.createElement("div"); el.className = "card"; el.id = "card-" + card.id;
    el.innerHTML = `<div class="prev"><canvas></canvas></div>
      <div class="row"><span class="name">${card.name}</span><span class="tag"></span></div>
      <div class="row opts"><select class="model" aria-label="Model"${card.models ? "" : " hidden"}></select>
        <select class="variant" aria-label="Caption style"></select></div>
      <div class="btns"><button data-a="dl">Download PNG</button><button data-a="copy">Copy image</button>
        <button data-a="share">Share…</button><button data-a="cap">Copy caption</button></div>
      <textarea rows="5" aria-label="Suggested caption"></textarea><div class="note cc"></div>`;
    box.appendChild(el);
    el.querySelector(".model").addEventListener("change", e => { pick[card.id] = e.target.value; refresh(); });
    el.querySelector(".variant").addEventListener("change", e => { variantPick[card.id] = +e.target.value; refresh(true); });
    el.querySelector("textarea").addEventListener("input", () => counter(el));
    el.querySelector(".btns").addEventListener("click", async e => {
      const a = e.target.dataset.a; if (!a || e.target.disabled) return;
      const cv = el.querySelector("canvas"), m = chosen(card);
      try {
        if (a === "dl") { const l = document.createElement("a"); l.download = fname(card, m); l.href = URL.createObjectURL(await blob(cv)); l.click(); toast("Saved " + l.download); }
        if (a === "copy") { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob(cv) })]); toast("Image copied"); }
        if (a === "cap") { await navigator.clipboard.writeText(el.querySelector("textarea").value); toast("Caption copied"); }
        if (a === "share") {
          const f = new File([await blob(cv)], fname(card, m), { type: "image/png" });
          await navigator.share({ files: [f], text: el.querySelector("textarea").value });
        }
      } catch (err) { if (err.name !== "AbortError") toast("Couldn't do that here: " + err.message); }
    });
  }
}

function selectTab(k, keepHash) {
  tab = k; localStorage.setItem("b65sharetab", k);
  if (!keepHash) history.replaceState(null, "", "#" + k);
  SHARE_PHASES.forEach(p => { $("panel-" + p.key).hidden = p.key !== k;
    document.querySelector(`#tabs [data-k="${p.key}"]`).setAttribute("aria-selected", p.key === k); });
  if (D) refresh(true);
}
function phaseStatus(p) {
  const x = p.st(D), n = x.total ? `${x.done}/${x.total} ${p.key === "p1" || p.key === "p1s" || p.key === "us" ? "steps" : p.key === "p3" ? "answers" : "tests"}` : "";
  if (!x.run_id) return ["not started", "No run yet. Teasers work now; results unlock when the run finishes."];
  if (x.dry) return [`dry run ${x.run_id}`, "Only a dry run so far. Results stay locked until the full run finishes."];
  return x.complete ? [`run ${x.run_id} · complete`, "Run complete: results cards are unlocked. Teaser cards stay number-free."]
    : [`run ${x.run_id} · ${x.state}${n ? " · " + n : ""}`, "Run in progress: the server withholds every measured value (tok/s, watts, tok/J) from this page until it finishes, so no card here can show one. Results unlock on their own."];
}
function refresh(forceCaption) {
  $("runinfo").textContent = D ? "Pick a phase. Cards refresh every 10 s." : "no runs yet";
  if (D) SHARE_PHASES.forEach(p => {
    const cards = CARDS.filter(c => groupOf(c) === p.key), ready = cards.filter(c => { const ms = eligible(c); return gate(c) && !(ms && !ms.length); });
    const x = p.st(D), [st, pol] = phaseStatus(p);
    $("tc-" + p.key).textContent = `${ready.length} of ${cards.length} ready${x.state === "running" && !x.dry ? " · running" : ""}`;
    $("tdot-" + p.key).className = "dot" + (x.state === "running" ? " on" : "");
    $("pst-" + p.key).textContent = st; $("ppol-" + p.key).textContent = pol;
  });
  for (const card of CARDS) {
    if (groupOf(card) !== tab) continue;   // only the open phase is drawn
    const el = $("card-" + card.id), cv = el.querySelector("canvas"), ms = D ? eligible(card) : null;
    const runLocked = D && !gate(card), empty = ms && !ms.length, locked = !D || runLocked || empty;
    const tag = el.querySelector(".tag");
    tag.className = "tag " + (locked ? "locked" : "safe");
    tag.textContent = runLocked ? (card.safe ? "waiting for data" : "🔒 locked") : empty ? "waiting for a model" : card.safe ? "✓ no numbers, safe to post" : "✓ final results";
    el.querySelectorAll(".btns button").forEach(b => b.disabled = locked || (b.dataset.a === "share" && !navigator.canShare));
    const ta = el.querySelector("textarea"), sel = el.querySelector(".model"), vsel = el.querySelector(".variant");
    let lock = el.querySelector(".lock");
    if (locked) {
      if (!lock) { lock = document.createElement("div"); lock.className = "lock"; el.querySelector(".prev").appendChild(lock); }
      lock.textContent = !D ? "Waiting for a run" : runLocked ? lockText(card) : "Appears once a model finishes its tests";
      const [W, H] = card.size || SIZES[fmt]; cv.width = W; cv.height = H;
      const ctx = cv.getContext("2d"); ctx.fillStyle = C.page; ctx.fillRect(0, 0, W, H);
      ta.value = ""; ta.placeholder = runLocked ? "Caption appears with the results." : "Caption appears with the card."; ta.disabled = true;
      vsel.innerHTML = ""; sel.disabled = true; counter(el);
      continue;
    }
    if (lock) lock.remove();
    ta.disabled = false;
    const m = chosen(card);
    if (ms) {
      const opts = ms.map(x => `<option value="${x.name}"${x === m ? " selected" : ""}>${x.display}</option>`).join("");
      if (sel.innerHTML !== opts) sel.innerHTML = opts;
      sel.disabled = ms.length < 2;
    }
    render(card, cv, m);
    const vars = card.caption(D, m), vi = Math.min(variantPick[card.id] || 0, vars.length - 1);
    const vopts = vars.map(([l], k) => `<option value="${k}"${k === vi ? " selected" : ""}>${l}</option>`).join("");
    if (vsel.innerHTML !== vopts) vsel.innerHTML = vopts;
    vsel.hidden = vars.length < 2;
    if (forceCaption || document.activeElement !== ta) ta.value = vars[vi][1];
    counter(el);
  }
}

async function poll() {
  try { D = (await (await fetch("api/share", { cache: "no-store" })).json()).run; refresh(); }
  catch (e) { $("runinfo").textContent = "dashboard offline"; }
  setTimeout(poll, 10000);
}
$("fmt").addEventListener("click", e => {
  const f = e.target.dataset.f; if (!f) return; fmt = f; localStorage.setItem("b65fmt", f);
  $("fmt").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === f)); if (D) refresh();
});
$("fmt").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === fmt));
$("handle").addEventListener("input", () => { localStorage.setItem("b65handle", $("handle").value); if (D) refresh(); });
$("price").addEventListener("input", () => { localStorage.setItem("b65price", $("price").value); if (D) refresh(true); });
// solo mode: share?solo=1&card=<id>&fmt=wide|tall[&model=<name>][&handle=@x][&price=899] renders one card at its exact size
const Q = new URLSearchParams(location.search);
if (Q.get("solo")) {
  fmt = Q.get("fmt") === "tall" ? "tall" : "wide";
  if (Q.get("handle") !== null) $("handle").value = Q.get("handle");
  if (Q.get("price") !== null) $("price").value = Q.get("price");
  document.querySelector(".viz-root").style.cssText = "padding:0;min-height:0;background:#0d0d0d";
  document.querySelector(".wrap").style.display = "none";
  const card = CARDS.find(c => c.id === Q.get("card")), [W, H] = (card && card.size) || SIZES[fmt];
  const cv = document.createElement("canvas"); cv.style.cssText = `width:${W}px;height:${H}px;display:block`;
  document.querySelector(".viz-root").appendChild(cv);
  fetch("api/share", { cache: "no-store" }).then(r => r.json()).then(async j => {
    D = j.run; await photoReady;
    if (!card || !D) { document.title = "error: no such card or run"; return; }
    if (!gate(card)) { document.title = "locked"; return; }  // results stay locked here too
    if (Q.get("model")) pick[card.id] = Q.get("model");
    const ms = eligible(card);
    if (ms && !ms.length) { document.title = "error: no model ready for this card"; return; }
    render(card, cv, chosen(card)); document.title = "ready";
  });
} else {
  build();
  const fromHash = location.hash.slice(1), keys = SHARE_PHASES.map(p => p.key);
  const saved = localStorage.getItem("b65sharetab");
  selectTab(keys.includes(fromHash) ? fromHash : keys.includes(saved) ? saved : keys[keys.length - 1], keys.includes(fromHash));
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (keys.includes(k) && k !== tab) selectTab(k, true); });
  poll(); photoReady.then(() => { if (D) refresh(); });
}
</script>
